name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install playwright==1.65.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests -p no:cacheprovider
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - run: RUN_DOCKER_INTEGRATION=1 python -m pytest -q tests/integration -p no:cacheprovider
      - run: RUN_BROWSER_INTEGRATION=1 python -m pytest -q tests/browser -p no:cacheprovider
      - if: always()
        run: docker compose down
