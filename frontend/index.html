
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixel Canvas</title>
    <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      margin: 24px;
    }

    .controls {
      margin: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    canvas {
      width: min(80vw, 700px);
      height: min(80vw, 700px);
      border: 1px solid #777;
      image-rendering: pixelated;
      cursor: crosshair;
      touch-action: none;
    }

    button, input {
      padding: 8px;
    }
  </style>
  </head>
  <body>
    <h1>Collaborative Pixel Canvas</h1>

    <div class="controls">
      <label>
        Colour:
        <input id="color" type="color" value="#ff0000">
      </label>
      <button id="clear">Clear my pixels</button>
      <label>Zoom <input id="zoom" type="range" min="1" max="8" value="1"></label>
    </div>

    <canvas id="canvas" width="1000" height="1000"></canvas>
    <p id="status">Connecting...</p>

    <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const colorInput = document.getElementById("color");
    const status = document.getElementById("status");
    const clearButton = document.getElementById("clear");
    const zoom = document.getElementById("zoom");
    let ready = false;
    let reconnectDelay = 500;
    let socket;

    function setReady(value) {
      ready = value;
      clearButton.disabled = !value;
      canvas.style.cursor = value ? "crosshair" : "wait";
    }
    setReady(false);

    function applyZoom() {
      const size = Math.min(window.innerWidth * 0.8, 700) * Number(zoom.value);
      canvas.style.width = `${size}px`;
      canvas.style.height = `${size}px`;
    }
    zoom.addEventListener("input", applyZoom);
    window.addEventListener("resize", applyZoom);
    applyZoom();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 1000, 1000);

    function paint(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }

    const wsProtocol =
      window.location.protocol === "https:" ? "wss:" : "ws:";

    async function connect() {
      setReady(false);
      status.textContent = "Synchronizing canvas...";
      try {
        const response = await fetch("/state");
        if (!response.ok) throw new Error("Canvas state unavailable");
      } catch (error) {
        scheduleReconnect();
        return;
      }
      socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
      socket.addEventListener("message", (event) => {
      const message = JSON.parse(event.data);

      if (message.type === "state") {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 1000, 1000);

        for (const [key, color] of Object.entries(message.pixels)) {
          const [x, y] = key.split(",").map(Number);
          paint(x, y, color);
        }
        reconnectDelay = 500;
        setReady(true);
        status.textContent = "Connected — live collaboration enabled";
      }

      if (message.type === "draw") {
        paint(message.x, message.y, message.color);
      }

      if (message.type === "clear") {
        for (const [x, y] of message.pixels) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, y, 1, 1);
        }
      }
      });
      socket.addEventListener("close", () => {
        setReady(false);
        scheduleReconnect();
      });
      socket.addEventListener("error", () => socket.close());
    }

    function scheduleReconnect() {
      setReady(false);
      status.textContent = "Disconnected — reconnecting...";
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    }
    connect();


    canvas.addEventListener("pointerdown", async (event) => {
      if (!ready) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(
        (event.clientX - rect.left) / rect.width * 1000
      );
      const y = Math.floor(
        (event.clientY - rect.top) / rect.height * 1000
      );

      const color = colorInput.value;
      if (x < 0 || x >= 1000 || y < 0 || y >= 1000) return;

      try {
        const response = await fetch("/draw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ x, y, color })
        });

        if (!response.ok) throw new Error("Drawing failed");

        if (ready) status.textContent = `Painted (${x}, ${y})`;
      } catch (error) {
        status.textContent = "Error: " + error.message;
      }
    });

    document.getElementById("clear").addEventListener(
      "click", async () => {
        if (!ready) return;
        try {
        const response = await fetch("/clear", { method: "DELETE" });

        if (!response.ok) {
          status.textContent = "Clear incomplete — reconnecting to refresh state";
          socket.close();
          return;
        }

        const data = await response.json();
        status.textContent = `Cleared ${data.cleared} of your pixels`;
        } catch (error) {
          status.textContent = "Clear failed — reconnecting to refresh state";
          socket.close();
        }
      }
    );
  </script>
  </body>
</html>
